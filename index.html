<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CxTV 2026 縣市長背書地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E6; --card:#FFFFFF; --ink:#1F3338; --muted:#667A80; --line:#E4DDCF;
  --teal:#4DBBBD; --teal-d:#2C8B8E; --orange:#F89A1B;
  --D:#3E9B6C; --K:#3C6EB4; --I:#F2A33A; --L:#C9384F;
  --sea:#E4F2F2;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
  background-image:radial-gradient(circle at 12% 0%,rgba(77,187,189,.16),transparent 45%),radial-gradient(circle at 100% 100%,rgba(248,154,27,.12),transparent 40%);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}

/* header */
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:20px}
.logo{background:#fff;border-radius:16px;padding:8px 16px;box-shadow:0 1px 0 var(--line),0 8px 24px -12px rgba(31,51,56,.25)}
.logo img{display:block;height:56px;width:auto}
.title{flex:1;min-width:240px}
.title h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.4vw,34px);margin:0;letter-spacing:.02em;line-height:1.2}
.title h1 em{font-style:normal;color:var(--teal-d)}
.title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.wikibtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px;font-weight:500;transition:transform .15s,background .15s}
.wikibtn:hover{background:var(--teal-d);transform:translateY(-1px)}
.wikibtn svg{width:15px;height:15px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 var(--line),0 14px 34px -22px rgba(31,51,56,.35)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 4px}
.fbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 10px;font:500 13px var(--sans);color:var(--ink);cursor:pointer;transition:all .15s}
.fbtn:hover{border-color:var(--teal)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fbtn i{width:11px;height:11px;border-radius:50%;display:inline-block}
.fbtn b{font-weight:700;opacity:.65}
.fsep{width:1px;background:var(--line);margin:2px 4px}

/* map */
.mapbox{margin:10px 14px 14px;border-radius:16px;background:linear-gradient(180deg,#EAF6F6,#DDEEEE);overflow:hidden;position:relative}
svg.map{display:block;width:100%;height:auto;max-height:78vh}
.county{cursor:pointer;outline:none}
.county .shape{fill:var(--c);stroke:#fff;stroke-width:1.4;stroke-linejoin:round;transition:filter .15s,opacity .2s}
.county .hit{fill:none;stroke:transparent;stroke-width:9;pointer-events:stroke}
.county:hover .shape,.county:focus-visible .shape{filter:brightness(1.12) saturate(1.1)}
.county.thin .shape{stroke-width:.6}
.county.sel .shape{stroke:var(--ink);stroke-width:2.6}
.county.thin.sel .shape{stroke-width:1.4}
.county.dim .shape{opacity:.16}
.islands{filter:drop-shadow(0 5px 5px rgba(31,51,56,.22))}
.lbl{font:700 14px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(20,40,44,.38);stroke-width:2.6px;stroke-linejoin:round;transition:opacity .2s}
.lbl.out{fill:var(--ink);stroke:#fff;stroke-width:3px;font-size:13px}
.lbl.dim{opacity:.25}
.leader{stroke:var(--ink);stroke-width:1;opacity:.55;pointer-events:none;fill:none}
.inset rect{fill:rgba(255,255,255,.55);stroke:var(--teal);stroke-width:1.2;stroke-dasharray:4 3;rx:10}
.inset text.cap{font:500 12px var(--sans);fill:var(--muted)}
.county{animation:pop .5s both;animation-delay:calc(var(--i)*28ms)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.county{animation:none}}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;opacity:0;transform:translate(12px,12px);transition:opacity .1s}
.tip.on{opacity:1}
.tip small{opacity:.7;margin-left:6px}
.hint{padding:0 18px 14px;color:var(--muted);font-size:13px;text-align:center}

/* panel */
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:16px}
@media (max-width:900px){.side{position:static}}
.panel{overflow:hidden}
.panel .bar{height:8px;background:var(--teal)}
.panel .body{padding:22px 24px 24px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.08em}
.county-name{font-family:var(--serif);font-weight:900;font-size:19px;margin:2px 0 14px}
.endorse{font-size:13px;color:var(--muted);margin-bottom:2px}
.cand{font-family:var(--serif);font-weight:900;font-size:clamp(34px,5vw,48px);line-height:1.1;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#FBF9F4}
.chip.party{color:#fff;border-color:transparent;background:var(--c)}
.chip.change{background:#FFF1DC;border-color:#F8C37A;color:#8A5200}
.chip.keep{background:#E3F4F4;border-color:#A9DBDC;color:#1D6C6F}
.why-h{font-size:13px;font-weight:700;color:var(--teal-d);letter-spacing:.1em;margin:0 0 6px}
.why{margin:0;font-size:16px;line-height:1.85;padding-left:14px;border-left:3px solid var(--orange)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.links a{font-size:13px;font-weight:500;color:var(--teal-d);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;transition:all .15s}
.links a:hover{border-color:var(--teal);background:#F1FAFA}
.links a span{opacity:.6}
.fade{animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.intro h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:4px 0 8px}
.intro p{margin:0 0 14px;color:var(--muted);font-size:15px}
.bars{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:6px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.bars span{display:block;height:100%}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.stat{display:flex;gap:10px;margin-top:16px}
.stat div{flex:1;background:#FBF9F4;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.stat b{display:block;font:900 24px var(--serif);color:var(--ink)}

/* list */
.list{padding:16px 16px 14px}
.list h3{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0 4px 10px;font-weight:700}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:480px){.rows{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:#FBF9F4;border-radius:10px;padding:6px 10px;cursor:pointer;font:400 14px var(--sans);color:var(--ink);text-align:left;transition:all .15s}
.row:hover{border-color:var(--teal);background:#F1FAFA}
.row.sel{border-color:var(--ink);background:#fff}
.row.dim{opacity:.3}
.row i{width:10px;height:10px;border-radius:50%;flex:none}
.row .n{color:var(--muted);width:2.6em;flex:none}
.row .c{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

footer{margin-top:22px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.8}
footer a{color:var(--teal-d)}
</style>
</head>

let idx = 0;

function addCounty(key, geo, parent, dx=0, dy=0) {
  const d = BY[key];
  const g = mk('g', {class:'county' + (['澎湖縣','金門縣','連江縣'].includes(key) ? ' thin' : ''), tabindex:0, role:'button', 'aria-label': key + '，背書 ' + d.cand, style:`--c:${PARTY[d.p].color};--i:${idx++}`, transform: dx||dy ? `translate(${dx} ${dy})` : null}, parent);
  mk('path', {class:'shape', d:geo.d}, g);
  if (SMALL.has(key)) mk('path', {class:'hit', d:geo.d}, g);
  nodes[key] = {g};
  g.addEventListener('click', () => select(key));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(key); } });
  g.addEventListener('mouseenter', e => tip(e, key));
  g.addEventListener('mousemove', e => tip(e, key));
  g.addEventListener('mouseleave', () => tipEl.classList.remove('on'));
  return g;
}
// big counties first, small ones last so they sit on top

order.forEach(k => addCounty(k, GEO.main[k], gMain));

function inset(key, geo, x, y, cap) {
  const g = mk('g', {class:'inset', transform:`translate(${x} ${y})`}, svg);
  mk('rect', {x:0, y:0, width:200, height:140}, g);
  const t = mk('text', {class:'cap', x:12, y:132}, g); t.textContent = cap;
  addCounty(key, geo, g);
}

// labels: [dx,dy] nudge, or {out:[x,y]} for a callout in the sea
const NUDGE = {'新北市':[22,10],'宜蘭縣':[-4,6],'桃園市':[-4,0],'新竹縣':[12,0],'苗栗縣':[-6,0],'台中市':[-6,0],'南投縣':[6,0],'雲林縣':[-4,6],'嘉義縣':[10,-2],'高雄市':[8,14],'屏東縣':[4,-14],'台東縣':[2,10],'花蓮縣':[-8,-20],'彰化縣':[-4,0],'台南市':[-6,-6]};
const OUT = {'台北市':[418,34], '基隆市':[532,34], '新竹市':[282,112], '嘉義市':[176,452], '澎湖縣':[62,448]};
const LAB_FS = {'新竹縣':12,'苗栗縣':13,'彰化縣':12,'嘉義縣':12,'桃園市':13};
function addLabel(key, cx, cy, parent, outPos) {
  const d = BY[key];
  if (outPos) {
    mk('path', {class:'leader', d:`M${cx} ${cy}L${outPos[0]} ${outPos[1] + (outPos[1] < cy ? 8 : -8)}`}, parent);
    const t = mk('text', {class:'lbl out', x:outPos[0], y:outPos[1]}, parent); t.textContent = d.s; return t;
  }
  const n = NUDGE[key] || [0,0];
  const t = mk('text', {class:'lbl', x:cx + n[0], y:cy + n[1], style:LAB_FS[key] ? `font-size:${LAB_FS[key]}px` : ''}, parent);
  t.textContent = d.s; return t;
}
Object.keys(GEO.main).forEach(k => { nodes[k].label = addLabel(k, GEO.main[k].c[0], GEO.main[k].c[1], gLbl, OUT[k]); });
// island labels live inside their inset
['連江縣','金門縣'].forEach(k => {
  const geo = (k === '連江縣' ? GEO.lian : GEO.kin)[k];
  const ins = nodes[k].g.parentNode;
  nodes[k].label = addLabel(k, geo.c[0], geo.c[1] + (k==='金門縣'?-26:-22), ins, [geo.c[0], geo.c[1] + (k==='金門縣'?-30:-26)]);
  nodes[k].label.setAttribute('class','lbl out');
  ins.querySelector('.leader')?.remove();
});

/* ---------- tooltip ---------- */
const tipEl = document.getElementById('tip');
function tip(e, key) {
  const d = BY[key];
  tipEl.innerHTML = `${key} → <b>${d.cand}</b><small>${d.plabel || PARTY[d.p].short}</small>`;
  tipEl.style.left = e.clientX + 'px'; tipEl.style.top = e.clientY + 'px';
  tipEl.classList.add('on');
}

/* ---------- filters ---------- */
let filter = null;  // {type:'p'|'st', v}
const cnt = f => DATA.filter(f).length;
const FILTERS = [
  ...Object.keys(PARTY).map(p => ({id:'p'+p, label:PARTY[p].short, color:PARTY[p].color, n:cnt(d=>d.p===p), test:d=>d.p===p})),
  {sep:true},
  {id:'chg', label:'改變支持', n:cnt(d=>d.st==='change'), test:d=>d.st==='change'},
  {id:'keep', label:'繼續支持', n:cnt(d=>d.st==='keep'), test:d=>d.st==='keep'}
];
const fWrap = document.getElementById('filters');
FILTERS.forEach(f => {
  if (f.sep) { const s = document.createElement('span'); s.className = 'fsep'; fWrap.appendChild(s); return; }
  const b = document.createElement('button'); b.className = 'fbtn'; b.type = 'button'; b.setAttribute('aria-pressed','false'); b.dataset.id = f.id;
  b.innerHTML = (f.color ? `<i style="background:${f.color}"></i>` : '') + `${f.label} <b>${f.n}</b>`;
  b.onclick = () => { filter = filter && filter.id === f.id ? null : f; applyFilter(); };
  fWrap.appendChild(b);
});
function applyFilter() {
  fWrap.querySelectorAll('.fbtn').forEach(b => b.setAttribute('aria-pressed', String(!!filter && filter.id === b.dataset.id)));
  DATA.forEach(d => {
    const dim = !!filter && !filter.test(d);
    nodes[d.k].g.classList.toggle('dim', dim);
    nodes[d.k].label.classList.toggle('dim', dim);
    rowEls[d.k].classList.toggle('dim', dim);
  });
}

/* ---------- list ---------- */
const rowsEl = document.getElementById('rows');
const rowEls = {};
const ROWS_ORDER = ['台北市','新北市','桃園市','新竹縣','新竹市','基隆市','宜蘭縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義縣','嘉義市','台南市','高雄市','屏東縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣'];
ROWS_ORDER.forEach(k => {
  const d = BY[k];
  const r = document.createElement('button'); r.type = 'button'; r.className = 'row';
  r.innerHTML = `<i style="background:${PARTY[d.p].color}"></i><span class="n">${d.s}</span><span class="c">${d.cand}</span>`;
  r.onclick = () => select(k);
  rowsEl.appendChild(r); rowEls[k] = r;
});

/* ---------- panel ---------- */
const panel = document.getElementById('panel');
let current = null;
function intro() {
  const tot = DATA.length;
  const bars = Object.keys(PARTY).map(p => `<span style="width:${cnt(d=>d.p===p)/tot*100}%;background:${PARTY[p].color}"></span>`).join('');
  const leg = Object.keys(PARTY).map(p => `<span><i style="background:${PARTY[p].color}"></i>${PARTY[p].short} ${cnt(d=>d.p===p)}</span>`).join('');
  panel.innerHTML = `<div class="bar"></div><div class="body intro fade">
    <div class="eyebrow">CxTV 編輯組 · 22 縣市長背書</div>
    <h2>點一下地圖上的縣市</h2>
    <p>顏色代表被背書候選人的黨籍。可以看到背書對象、是否改變立場，以及編輯組的理由。</p>
    <div class="bars">${bars}</div><div class="legendrow">${leg}</div>
    <div class="stat"><div><b>${cnt(d=>d.st==='change')}</b>個縣市改變支持</div><div><b>${cnt(d=>d.st==='keep')}</b>個縣市繼續支持</div></div>
    <div class="links"><a target="_blank" rel="noopener" href="${WIKI_MAIN}">維基百科：2026年直轄市長及縣市長選舉 <span>↗</span></a></div>
  </div>`;
}
function select(key) {
  if (current === key) { return clear(); }
  current = key;
  const d = BY[key];
  Object.entries(nodes).forEach(([k, n]) => n.g.classList.toggle('sel', k === key));
  Object.entries(rowEls).forEach(([k, r]) => r.classList.toggle('sel', k === key));
  nodes[key].g.parentNode.appendChild(nodes[key].g);   // lift selected shape above neighbours
  const stance = d.st === 'change' ? '<span class="chip change">改變支持</span>' : d.st === 'keep' ? '<span class="chip keep">繼續支持</span>' : '';
  panel.style.setProperty('--c', PARTY[d.p].color);
  panel.innerHTML = `<div class="bar" style="background:${PARTY[d.p].color}"></div><div class="body fade">
    <div class="eyebrow">縣市長選舉</div>
    <div class="county-name">${key}</div>
    <div class="endorse">CxTV 背書</div>
    <h2 class="cand">${d.cand}</h2>
    <div class="chips"><span class="chip party">${d.plabel || PARTY[d.p].name}</span>${stance}</div>
    <h3 class="why-h">背書理由</h3>
    <p class="why">${d.why}</p>
    <div class="links">
      <a target="_blank" rel="noopener" href="${wikiSearch(d.cand)}">維基百科：${d.cand} <span>↗</span></a>
      <a target="_blank" rel="noopener" href="${WIKI_MAIN}">2026 縣市長選舉總覽 <span>↗</span></a>
    </div></div>`;
  if (window.matchMedia('(max-width:900px)').matches) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function clear() {
  current = null;
  Object.values(nodes).forEach(n => n.g.classList.remove('sel'));
  Object.values(rowEls).forEach(r => r.classList.remove('sel'));
  intro();
}
svg.addEventListener('click', e => { if (e.target === svg) clear(); });
intro();
</script>
</body>
</html>
